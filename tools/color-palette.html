<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Color Palette Generator - WebTools</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Web<span>Tools</span></a>
            <ul class="nav-links">
                <li><a href="tools.html">Tools</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button id="darkModeToggle">🌙</button>
        </nav>
        <a href="../tools.html" class="btn-back">← Back to Tools</a>
    </header>
    <main class="tool-page">
        <h1><i class="fa fa-palette"></i> Color Palette Generator</h1>
        <p>Create random color palettes.</p>
        <button id="generateColors" class="btn">Generate Palette</button>
        <div id="palette" style="display:flex;gap:10px;margin-top:20px;"></div>
    </main>

    <div class="mahmoud">

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 WebTools. <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a></p>
        <div class="ad-banner">[Ad Space]</div>
    </footer>

    <script src="../assets/js/main.js"></script>

    <script>
        function randomColor() {
            return "#" + Math.floor(Math.random() * 16777215).toString(16);
        }
        document.getElementById("generateColors").addEventListener("click", () => {
            const palette = document.getElementById("palette");
            palette.innerHTML = "";
            for (let i = 0; i < 5; i++) {
                const color = randomColor();
                const div = document.createElement("div");
                div.style.background = color;
                div.style.width = "100px";
                div.style.height = "100px";
                div.textContent = color;
                div.style.color = "#fff";
                div.style.display = "flex";
                div.style.alignItems = "center";
                div.style.justifyContent = "center";
                palette.appendChild(div);
            }
        });
    </script>
</body>

</html>

</html>
