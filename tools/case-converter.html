<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Case Converter - WebTools</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Web<span>Tools</span></a>
            <ul class="nav-links">
                <li><a href="tools.html">Tools</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button id="darkModeToggle">🌙</button>
        </nav>
        <a href="../tools.html" class="btn-back">← Back to Tools</a>
    </header>
    <main class="tool-page">
        <h1><i class="fa fa-text-height"></i> Case Converter</h1>
        <p>Convert text to uppercase or lowercase easily.</p>
        <textarea id="caseText" rows="5" placeholder="Enter text..."></textarea>
        <button onclick="convert('upper')" class="btn">UPPERCASE</button>
        <button onclick="convert('lower')" class="btn">lowercase</button>
        <div class="output-box">
            <p id="output"></p>
        </div>
        <button class="btn-copy" onclick="copyOutput()">Copy</button>
    </main>

    <div class="mahmoud">

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 WebTools. <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a></p>
        <div class="ad-banner">[Ad Space]</div>
    </footer>

    <script src="../assets/js/main.js"></script>

    <script>
        function convert(type) {
            const text = document.getElementById("caseText").value;
            document.getElementById("output").textContent = type === "upper" ? text.toUpperCase() : text.toLowerCase();
        }
    </script>
</body>

</html>
