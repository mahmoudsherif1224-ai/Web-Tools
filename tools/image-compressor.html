<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Compressor - WebTools</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Web<span>Tools</span></a>
            <ul class="nav-links">
                <li><a href="tools.html">Tools</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button id="darkModeToggle">🌙</button>
        </nav>
        <a href="../tools.html" class="btn-back">← Back to Tools</a>
    </header>
    <main class="tool-page">
        <h1><i class="fa fa-image"></i> Image Compressor</h1>
        <p>Compress images to reduce size.</p>
        <input type="file" id="upload" accept="image/*">
        <canvas id="canvas"></canvas>
    </main>

    <div class="mahmoud">

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 WebTools. <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms</a></p>
        <div class="ad-banner">[Ad Space]</div>
    </footer>


    <script src="../assets/js/main.js"></script>

    <script>
        const upload = document.getElementById("upload");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        upload.addEventListener("change", e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width / 2;
                    canvas.height = img.height / 2;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
